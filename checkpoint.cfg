// Enable Mule Kick before map scripts run, even before online settings arrive.
set scr_zm_extra_perk_all 1
// Run "exec checkpoint.cfg" after loading the Game Save mod.
// F11 is used by the player and the companion; F10 loads a manager-written map switch.
bind F11 "devsave 1"
bind F12 "loadgame_continue"
bind F10 "exec checkpoint_switch.cfg"
bind F5 "exec checkpoint_speed.cfg"
bind F4 "exec checkpoint_weapons.cfg"
bind F3 "exec checkpoint_speed_local.cfg"
bind F2 "exec checkpoint_power.cfg"
bind F9 "set checkpoint_coop_pause 1"
bind F8 "set checkpoint_coop_pause 0"
bind F7 "exec checkpoint_borderless.cfg"
bind F6 "exec checkpoint_fullscreen.cfg"
exec checkpoint_speed.cfg
set checkpoint_restore_power_on 0
set checkpoint_map_restore_token ""
set checkpoint_legacy_vision_token ""
